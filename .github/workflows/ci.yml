name: CI
on:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lua syntax check
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          find . -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
